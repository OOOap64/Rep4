name: CI
on:
   # События, которые запускают jobs
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "main" ]

# jobs запускаются параллельно, если не указана последовательность
jobs:
    # Название job вы можете назвать как угодно
      

    run:
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v4
          - uses: actions/setuo-python@v5
          - name: Run a web 
            run: python app.py && python -m pip install --upgrade pip
          - name: Lint
            run: pip install ruff && ruff check .

    build: 
      needs: run 
      if: github.event_name=='push' && github.ref=="refs/heads/main"
      runs-on: ubuntu-latest 
      permissions:
        contents: read
        packages: write
      steps:
        - uses: actions/checkout@v4
        - name:  Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: OOOap64
            password: ggfd25y448$#@!
        - name: Build and push
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ghcr.io/OOOap64/Rep3:latest
    deploy:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Deploy
          run: echo "Тут ssh/команда деплоя, например docker pull/up на сервере"

