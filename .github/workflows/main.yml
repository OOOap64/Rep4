name: CI
on:
   # События, которые запускают jobs
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "main" ]

# jobs запускаются параллельно, если не указана последовательность
jobs:
    # Название job вы можете назвать как угодно
      

    lint:
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v4
          - uses: actions/setuo-python@v5
          - name: Run a web 
            run: python app.py && python -m pip install --upgrade pip
          - name: Lint
            run: pip install ruff && ruff check .

    build: 
      needs: lint
      runs-on: ubuntu-latest 
      steps:
        - name: Docker Setup Docker
          uses: docker/setup-docker-action@v5.5.0
        - name: Build docker container
          run: docker build -t app
    deploy:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Deploy
          run: docker run app

